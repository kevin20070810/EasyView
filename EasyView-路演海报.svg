<path d="m583 552 32 11-25 23" fill="none" stroke="#4c947e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<!-- browser card -->
<g filter="url(#shadow)"><rect x="134" y="470" width="377" height="221" rx="19" fill="#fff"/><path d="M153 470h339a19 19 0 0 1 19 19v23H134v-23a19 19 0 0 1 19-19" fill="#eaf1ee"/><circle cx="157" cy="493" r="4" fill="#de8d64"/><circle cx="172" cy="493" r="4" fill="#e9c474"/><circle cx="187" cy="493" r="4" fill="#7fb49c"/><rect x="210" y="486" width="236" height="13" rx="6" fill="#d4e0da"/>
<rect x="157" y="530" width="328" height="14" rx="7" fill="#dce5df"/><rect x="157" y="556" width="247" height="10" rx="5" fill="#e7ece8"/>
