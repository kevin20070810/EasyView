<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" role="img" aria-labelledby="title desc">
<title id="title">简界 EasyView 路演海报</title>
<desc id="desc">不改造网站，也能把复杂页面变成清晰的大字办事入口。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf8ef"/><stop offset="1" stop-color="#f0f4eb"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2f1e9"/><stop offset="1" stop-color="#d4eae5"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f7fbf8"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#17434b" flood-opacity=".13"/></filter>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#347566" opacity=".2"/></pattern>
</defs>
<rect width="1080" height="1440" fill="url(#bg)"/>
<circle cx="990" cy="88" r="210" fill="#e6efe5" opacity=".7"/><circle cx="76" cy="638" r="140" fill="#f5ead6" opacity=".52"/>
<!-- masthead -->
<g transform="translate(72 58)"><rect width="54" height="54" rx="17" fill="#075f70"/><path d="M15 37V17h7l6 8 6-8h6v20h-7V27l-5 7-5-7v10z" fill="#fff"/><text x="70" y="25" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="800" fill="#123e46">简界 <tspan fill="#62817b" font-size="18" font-weight="600">EASYVIEW</tspan></text><text x="70" y="49" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" letter-spacing="2" fill="#66827a">让数字生活更好办</text></g>
<g transform="translate(766 68)"><rect width="242" height="42" rx="21" fill="#fff" stroke="#c9dbd0"/><circle cx="22" cy="21" r="6" fill="#eea04b"/><text x="40" y="27" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="700" fill="#47665c">银龄数字生活 · 浏览器扩展</text></g>
<!-- headline -->
<text x="72" y="197" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="64" font-weight="900" letter-spacing="-2" fill="#163b42">让每一个网站</text>
<text x="72" y="277" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="64" font-weight="900" letter-spacing="-2" fill="#075f70">都更容易办事</text>
<rect x="74" y="303" width="63" height="7" rx="3.5" fill="#ed9b48"/>
<text x="72" y="352" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="600" fill="#4c6962">不改造网站，也能把复杂页面</text>
<text x="72" y="387" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="600" fill="#4c6962">变成看得懂、点得准的大字入口。</text>
<!-- hero scene -->
<rect x="72" y="423" width="936" height="312" rx="34" fill="url(#hero)"/>
<rect x="72" y="423" width="936" height="312" rx="34" fill="url(#dots)" opacity=".7"/>
