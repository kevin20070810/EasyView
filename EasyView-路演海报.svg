<path d="M72 1234h936" stroke="#d9e2d8" stroke-width="2"/>
<text x="72" y="1272" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="800" fill="#173e44">简界 EasyView</text><text x="72" y="1302" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" fill="#71867c">让数字生活更好办 · 当前产品阶段：Chrome 扩展原型</text>
