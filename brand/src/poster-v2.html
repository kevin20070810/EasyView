<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0D5C63;--warm:#E86A33;--soft:#F2A65A;--cream:#FFF8EC;--paper:#FFFDF8}
body{background:#22343A;font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}
.p{position:relative;width:1080px;height:1620px;overflow:hidden;background:linear-gradient(158deg,#10565E 0%,#0B3E45 52%,#072B31 100%)}
.grain{position:absolute;inset:0;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(255,248,236,.10)}
.sun{position:absolute;right:-70px;top:120px;width:330px;height:330px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#F6A96B,#E86A33 68%);box-shadow:0 0 90px rgba(232,106,51,.45)}
.sun::after{content:"";position:absolute;inset:-26px;border-radius:50%;border:2.5px solid rgba(255,248,236,.35)}
.vslogan{position:absolute;right:88px;top:470px;writing-mode:vertical-rl;font-size:58px;letter-spacing:16px;color:var(--cream);font-weight:700;line-height:1.9}
.vslogan em{font-style:normal;color:var(--soft)}
.seal{position:absolute;right:96px;top:1178px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
.eyebrow{position:absolute;left:76px;top:120px;font-size:25px;letter-spacing:7px;color:var(--soft);font-weight:700}
h1{position:absolute;left:76px;top:176px;font-size:104px;line-height:1.24;color:var(--cream);font-weight:700;letter-spacing:3px}
h1 em{font-style:normal;color:var(--warm)}
.brush{position:absolute;left:288px;top:438px}
.sub{position:absolute;left:78px;top:492px;font-size:29px;line-height:1.8;color:rgba(255,248,236,.78);letter-spacing:1px}
.stage{position:absolute;left:52px;top:700px;width:700px;height:600px}
.frame{position:absolute;left:26px;top:36px;width:600px;height:520px;background:var(--paper);border-radius:26px;transform:rotate(-3.2deg);box-shadow:0 30px 70px rgba(0,0,0,.42);overflow:hidden}
.frame .bar{height:46px;background:#EDF0F1;display:flex;align-items:center;gap:8px;padding:0 18px}
.frame .bar i{width:11px;height:11px;border-radius:50%;background:#C7CFD3}
.frame .bar u{flex:1;height:15px;border-radius:8px;background:#fff;margin-left:10px;text-decoration:none}
.frame .body{background:var(--cream);padding:20px;display:flex;flex-direction:column;gap:16px;height:calc(100% - 46px)}
.card{background:#fff;border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:16px;box-shadow:0 3px 10px rgba(10,66,73,.08);flex:1}
.card .ic{width:50px;height:50px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center}
.card .tx{flex:1}.card .tx b{display:block;font-size:29px;color:var(--ink);letter-spacing:1px}
.card .tx s{display:block;text-decoration:none;font-size:17px;color:#5B6B76;margin-top:5px}
.card .go{background:var(--warm);color:#fff;font-size:19px;padding:11px 18px;border-radius:999px;flex:none;letter-spacing:1px}
.pop{position:absolute;right:-196px;top:176px;width:330px;background:#fff;border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:14px;transform:rotate(5.5deg);box-shadow:0 26px 60px rgba(0,0,0,.5)}
.pop .ic{width:46px;height:46px;border-radius:12px;background:rgba(232,106,51,.14);display:flex;align-items:center;justify-content:center;flex:none}
.pop b{display:block;font-size:26px;color:var(--ink)}
.pop s{display:block;text-decoration:none;font-size:15px;color:#5B6B76;margin-top:4px}
.pop .go{margin-left:auto;background:var(--warm);color:#fff;font-size:16px;padding:9px 14px;border-radius:999px}
.tagline{position:absolute;left:80px;top:640px;font-size:24px;color:var(--soft);letter-spacing:3px}
.chips{position:absolute;left:76px;top:1362px;display:flex;gap:16px}
.chips span{font-size:24px;color:var(--cream);border:2px solid rgba(255,248,236,.35);border-radius:999px;padding:12px 24px;letter-spacing:2px}
.foot{position:absolute;left:76px;right:76px;top:1470px;display:flex;align-items:center;gap:20px;border-top:1.5px solid rgba(255,248,236,.18);padding-top:34px}
.foot b{font-size:32px;color:var(--cream);letter-spacing:2px}
.foot i{font-family:Verdana,sans-serif;font-style:normal;font-size:18px;color:rgba(255,248,236,.6);letter-spacing:2px}
.foot s{text-decoration:none;margin-left:auto;font-size:18px;color:rgba(255,248,236,.6);letter-spacing:1px}
</style></head><body>
