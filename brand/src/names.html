<!doctype html><html><head><meta charset="utf-8"><style>

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0D5C63; --ink-deep:#0A4249; --warm:#E86A33; --warm-soft:#F2A65A;
  --cream:#FFF8EC; --paper:#FFFDF8; --text:#1F2933; --muted:#5B6B76;
  --zh:"Microsoft YaHei","Noto Sans SC",sans-serif;
  --en:"Verdana","Segoe UI",sans-serif;
}

body{background:#E9ECEE;font-family:var(--zh)}
.sheet{width:1200px;background:#fff;border-radius:22px;padding:44px 52px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h2{font-size:22px;color:var(--text);margin-bottom:8px}
p.note{font-size:16px;color:var(--muted);margin-bottom:26px}
.rowline{position:relative;display:flex;align-items:center;gap:26px;padding:26px 28px;border-radius:18px;margin-bottom:18px;background:var(--cream)}
.rowline .mk{width:88px;height:88px;flex:none}
.rowline .nm b{font-size:52px;color:var(--ink);letter-spacing:3px}
.rowline .nm i{font-family:var(--en);font-style:normal;font-size:22px;color:var(--muted);letter-spacing:3px;margin-left:16px}
.rowline .tg{margin-left:auto;font-size:20px;color:var(--muted);letter-spacing:1px;text-align:right;max-width:420px;line-height:1.6}
.rowline .rec{position:absolute;right:-10px;top:-12px;background:var(--warm);color:#fff;font-size:16px;padding:6px 16px;border-radius:999px;letter-spacing:2px}
</style></head><body>
<div class="sheet" data-shot="names">
  <h2>品牌名称候选 · 第一版</h2>
  <p class="note">同一标志、同一配色下的三种读法。推荐「暖龄」：有照顾感，又不把用户标签成"老人"。</p>
  
<div class="rowline">
  <div class="mk">
<svg width="100%" height="100%" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="injnameshtml1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14707A"/><stop offset="1" stop-color="#0A4249"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#injnameshtml1)"/>
  <circle cx="64" cy="19.5" r="6.5" fill="#F2A65A"/>
  <path d="M94.2 28 A47 47 0 1 1 33.8 28" fill="none" stroke="#E86A33" stroke-width="7" stroke-linecap="round"/>
  <rect x="35" y="39" width="58" height="50" rx="9" fill="#FFF8EC"/>
  <rect x="43" y="47" width="30" height="7" rx="3.5" fill="#0D5C63"/>
  <rect x="43" y="59.5" width="42" height="5" rx="2.5" fill="#0D5C63" opacity=".26"/>
  <rect x="43" y="69" width="42" height="13" rx="6.5" fill="#E86A33"/>
</svg></div>
  <div class="nm"><b>暖龄</b><i>EasyView</i></div>
  <div class="tg">暖 = 照顾与温度；龄 = 尊重地指向年龄。<br>宣传语：暖龄相伴，上网不难</div>
  <div class="rec">推荐</div>
</div>
  
<div class="rowline">
  <div class="mk">
<svg width="100%" height="100%" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="injnameshtml2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14707A"/><stop offset="1" stop-color="#0A4249"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#injnameshtml2)"/>
  <circle cx="64" cy="19.5" r="6.5" fill="#F2A65A"/>
  <path d="M94.2 28 A47 47 0 1 1 33.8 28" fill="none" stroke="#E86A33" stroke-width="7" stroke-linecap="round"/>
  <rect x="35" y="39" width="58" height="50" rx="9" fill="#FFF8EC"/>
  <rect x="43" y="47" width="30" height="7" rx="3.5" fill="#0D5C63"/>
  <rect x="43" y="59.5" width="42" height="5" rx="2.5" fill="#0D5C63" opacity=".26"/>
  <rect x="43" y="69" width="42" height="13" rx="6.5" fill="#E86A33"/>
</svg></div>
  <div class="nm"><b>伴龄</b><i>EasyView</i></div>
  <div class="tg">陪伴感更强，但"伴龄"读音接近"半龄"，口播易混。</div>
  
</div>
  
<div class="rowline">
  <div class="mk">
<svg width="100%" height="100%" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="injnameshtml3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14707A"/><stop offset="1" stop-color="#0A4249"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#injnameshtml3)"/>
  <circle cx="64" cy="19.5" r="6.5" fill="#F2A65A"/>
  <path d="M94.2 28 A47 47 0 1 1 33.8 28" fill="none" stroke="#E86A33" stroke-width="7" stroke-linecap="round"/>
  <rect x="35" y="39" width="58" height="50" rx="9" fill="#FFF8EC"/>
  <rect x="43" y="47" width="30" height="7" rx="3.5" fill="#0D5C63"/>
  <rect x="43" y="59.5" width="42" height="5" rx="2.5" fill="#0D5C63" opacity=".26"/>
  <rect x="43" y="69" width="42" height="13" rx="6.5" fill="#E86A33"/>
</svg></div>
  <div class="nm"><b>安伴</b><i>EasyView</i></div>
  <div class="tg">强调安全、可靠、有人陪；年龄指向较弱。</div>
  
</div>
</div>
</body></html>
