<!doctype html><html><head><meta charset="utf-8"><style>

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0D5C63; --ink-deep:#0A4249; --warm:#E86A33; --warm-soft:#F2A65A;
  --cream:#FFF8EC; --paper:#FFFDF8; --text:#1F2933; --muted:#5B6B76;
  --zh:"Microsoft YaHei","Noto Sans SC",sans-serif;
  --en:"Verdana","Segoe UI",sans-serif;
}

body{background:#DDE2E4;font-family:var(--zh)}
.poster{position:relative;width:1080px;height:1620px;background:var(--cream);overflow:hidden}
.deco1{position:absolute;right:-180px;top:-180px;width:560px;height:560px;border-radius:50%;background:var(--ink);opacity:.05}
.deco2{position:absolute;left:-140px;bottom:240px;width:420px;height:420px;border-radius:50%;border:56px solid var(--warm);opacity:.08}
.hdr{position:absolute;left:72px;right:72px;top:64px;display:flex;align-items:center;justify-content:space-between}
.hdr .brand{display:flex;align-items:center;gap:18px}
.hdr .brand b{font-size:30px;color:var(--ink);letter-spacing:1px}
.hdr .brand i{font-family:var(--en);font-style:normal;font-size:19px;color:var(--muted);letter-spacing:2px;margin-top:6px}
.hdr .tag{font-size:21px;color:var(--ink);background:rgba(13,92,99,.09);border:1.5px solid rgba(13,92,99,.25);padding:10px 22px;border-radius:999px;letter-spacing:2px}
.eyebrow{position:absolute;left:72px;top:196px;font-size:26px;color:var(--warm);letter-spacing:6px;font-weight:700}
h1{position:absolute;left:72px;top:248px;font-size:96px;line-height:1.22;color:var(--ink);font-weight:700;letter-spacing:2px}
h1 em{font-style:normal;color:var(--warm)}
.sub{position:absolute;left:72px;top:520px;font-size:30px;line-height:1.75;color:var(--muted);letter-spacing:1px}
.demo{position:absolute;left:72px;top:672px;width:936px;height:520px;background:var(--paper);border-radius:30px;box-shadow:0 10px 34px rgba(10,66,73,.10);padding:34px 36px;display:flex;gap:26px;align-items:stretch}
.mock{border-radius:18px;overflow:hidden;border:1.5px solid rgba(13,92,99,.16);display:flex;flex-direction:column}
.mock .bar{height:40px;background:#EEF1F2;display:flex;align-items:center;gap:7px;padding:0 14px;flex:none}
.mock .bar i{width:10px;height:10px;border-radius:50%;background:#C7CFD3}
.mock .bar u{flex:1;height:14px;border-radius:7px;background:#fff;margin-left:8px;text-decoration:none}
.mock .body{flex:1;background:#fff;padding:16px}
.bad .body{display:flex;flex-direction:column;gap:7px}
.bad .ln{height:7px;border-radius:3px;background:#C9D2D6}
.bad .ln.ad{height:34px;background:#E4E9EB;border-radius:5px}
.bad .ln.link{background:#9FB6C9;width:52%}
.bad .ln.t{height:11px;background:#8FA0A8;width:70%}
.good{flex:1}
.good .body{background:var(--cream);padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(10,66,73,.07);flex:1}
.card .ic{width:44px;height:44px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center}
.card .tx{flex:1}
.card .tx b{display:block;font-size:26px;color:var(--ink);letter-spacing:1px}
.card .tx s{display:block;text-decoration:none;font-size:15px;color:var(--muted);margin-top:4px}
.card .go{background:var(--warm);color:#fff;font-size:17px;padding:9px 16px;border-radius:999px;flex:none;letter-spacing:1px}
.arrow{width:96px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.arrow b{font-size:20px;color:var(--warm);letter-spacing:2px;writing-mode:vertical-rl}
.cap{position:absolute;left:0;right:0;bottom:-40px;text-align:center;font-size:20px;letter-spacing:1px}
.cap.badc{color:var(--muted)} .cap.goodc{color:var(--ink);font-weight:700}
.wrap{position:relative;flex:none}
.w1{width:330px}.w2{width:414px}
.chips{position:absolute;left:72px;top:1268px;display:flex;gap:18px}
.chips span{font-size:25px;color:var(--ink);background:#fff;border:2px solid rgba(13,92,99,.22);border-radius:999px;padding:13px 26px;letter-spacing:2px}
.band{position:absolute;left:0;right:0;bottom:0;height:236px;background:var(--ink)}
.band .in{position:absolute;left:72px;right:72px;top:52px;display:flex;align-items:center;gap:30px}
.band .nm b{font-size:46px;color:var(--cream);letter-spacing:3px;display:block}
.band .nm i{font-family:var(--en);font-style:normal;font-size:20px;color:rgba(255,248,236,.72);letter-spacing:3px}
.band .slogan{margin-left:auto;text-align:right}
.band .slogan b{display:block;font-size:30px;color:var(--warm-soft);letter-spacing:4px}
.band .slogan s{display:block;text-decoration:none;font-size:19px;color:rgba(255,248,236,.66);margin-top:12px;letter-spacing:1px}
</style></head><body>
