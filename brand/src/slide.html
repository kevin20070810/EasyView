<!doctype html><html><head><meta charset="utf-8"><style>

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0D5C63; --ink-deep:#0A4249; --warm:#E86A33; --warm-soft:#F2A65A;
  --cream:#FFF8EC; --paper:#FFFDF8; --text:#1F2933; --muted:#5B6B76;
  --zh:"Microsoft YaHei","Noto Sans SC",sans-serif;
  --en:"Verdana","Segoe UI",sans-serif;
}

body{background:#DDE2E4;font-family:var(--zh)}
.slide{position:relative;width:1920px;height:1080px;background:var(--cream);overflow:hidden}
.left{position:absolute;left:110px;top:0;bottom:0;width:880px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:26px;color:var(--warm);letter-spacing:6px;font-weight:700}
h1{font-size:104px;line-height:1.2;color:var(--ink);font-weight:700;letter-spacing:2px;margin-top:26px}
h1 em{font-style:normal;color:var(--warm)}
.sub{font-size:32px;line-height:1.75;color:var(--muted);margin-top:34px;letter-spacing:1px}
.chips{display:flex;gap:16px;margin-top:44px}
.chips span{font-size:24px;color:var(--ink);background:#fff;border:2px solid rgba(13,92,99,.22);border-radius:999px;padding:12px 24px;letter-spacing:2px}
.foot{position:absolute;left:110px;bottom:64px;display:flex;align-items:center;gap:22px}
.foot b{font-size:34px;color:var(--ink);letter-spacing:2px}
.foot i{font-family:var(--en);font-style:normal;font-size:19px;color:var(--muted);letter-spacing:2px}
.foot s{text-decoration:none;font-size:20px;color:var(--warm);letter-spacing:3px;margin-left:14px}
.right{position:absolute;right:110px;top:50%;transform:translateY(-50%);width:760px;height:700px;background:var(--paper);border-radius:30px;box-shadow:0 14px 40px rgba(10,66,73,.12);padding:34px}
.mock{height:100%;border-radius:18px;overflow:hidden;border:1.5px solid rgba(13,92,99,.16);display:flex;flex-direction:column}
.mock .bar{height:46px;background:#EEF1F2;display:flex;align-items:center;gap:8px;padding:0 16px;flex:none}
.mock .bar i{width:11px;height:11px;border-radius:50%;background:#C7CFD3}
.mock .bar u{flex:1;height:16px;border-radius:8px;background:#fff;margin-left:10px;text-decoration:none}
.mock .body{flex:1;background:var(--cream);padding:18px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.card{background:#fff;border-radius:16px;padding:14px 20px;display:flex;align-items:center;gap:18px;box-shadow:0 2px 10px rgba(10,66,73,.07);flex:1}
.card .ic{width:50px;height:50px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center}
.card .tx{flex:1}
.card .tx b{display:block;font-size:31px;color:var(--ink);letter-spacing:1px}
.card .tx s{display:block;text-decoration:none;font-size:18px;color:var(--muted);margin-top:6px}
.card .go{background:var(--warm);color:#fff;font-size:22px;padding:12px 22px;border-radius:999px;flex:none;letter-spacing:1px}
.deco{position:absolute;right:-160px;top:-200px;width:520px;height:520px;border-radius:50%;background:var(--ink);opacity:.05}
</style></head><body>
<div class="slide" data-shot="slide">
  <div class="deco"></div>
  <div class="left">
    <div class="eyebrow">48 小时黑客松 · 适老化赛道</div>
    <h1>网页再乱，<br>也能<em>一眼看懂</em>。</h1>
    <div class="sub">暖龄把医院、政务、购票等网站，<br>自动整理成大字、大按钮、只留要办的事。</div>
    <div class="chips"><span>看病挂号</span><span>政务办事</span><span>出行购票</span><span>看新闻</span><span>找兴趣</span></div>
  </div>
  <div class="right">
    <div class="mock">
      <div class="bar"><i></i><i></i><i></i><u></u></div>
      <div class="body">
        <div class="card"><div class="ic" style="background:rgba(13,92,99,.12)"><svg width="32" height="32" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="#0D5C63" stroke-width="3.4" stroke-linecap="round"/></svg></div><div class="tx"><b>我要挂号</b><s>协和医院 · 明天上午 有号</s></div><div class="go">去办理</div></div>
        <div class="card"><div class="ic" style="background:rgba(232,106,51,.13)"><svg width="32" height="32" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z M9 12h7M9 16h7" fill="none" stroke="#E86A33" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="tx"><b>查看报告</b><s>上周的化验单 已出</s></div><div class="go">去查看</div></div>
        <div class="card"><div class="ic" style="background:rgba(13,92,99,.12)"><svg width="32" height="32" viewBox="0 0 24 24"><path d="M4 17h16M6 17V9m6 8V5m6 12v-6" fill="none" stroke="#0D5C63" stroke-width="2.6" stroke-linecap="round"/></svg></div><div class="tx"><b>缴纳水电费</b><s>9 月账单 待缴</s></div><div class="go">去缴纳</div></div>
        <div class="card"><div class="ic" style="background:rgba(232,106,51,.13)"><svg width="32" height="32" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13" stroke="#E86A33" stroke-width="2.8" stroke-linecap="round"/></svg></div><div class="tx"><b>看今日新闻</b><s>已去掉广告，只剩正文</s></div><div class="go">去阅读</div></div>
      </div>
    </div>
  </div>
  <div class="foot"><div style="width:64px;height:64px">
<svg width="100%" height="100%" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="injslidehtml0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14707A"/><stop offset="1" stop-color="#0A4249"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#injslidehtml0)"/>
  <circle cx="64" cy="19.5" r="6.5" fill="#F2A65A"/>
  <path d="M94.2 28 A47 47 0 1 1 33.8 28" fill="none" stroke="#E86A33" stroke-width="7" stroke-linecap="round"/>
  <rect x="35" y="39" width="58" height="50" rx="9" fill="#FFF8EC"/>
  <rect x="43" y="47" width="30" height="7" rx="3.5" fill="#0D5C63"/>
  <rect x="43" y="59.5" width="42" height="5" rx="2.5" fill="#0D5C63" opacity=".26"/>
  <rect x="43" y="69" width="42" height="13" rx="6.5" fill="#E86A33"/>
</svg></div><b>暖龄</b><i>EasyView</i><s>暖龄相伴，上网不难</s></div>
</div>
</body></html>
