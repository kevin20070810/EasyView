*{box-sizing:border-box;margin:0;padding:0}

.brush{position:absolute;left:262px;top:392px}
.sub{position:absolute;left:112px;top:446px;font-size:30px;line-height:1.75;color:rgba(255,248,236,.78);letter-spacing:1px}

.stage{position:absolute;left:1010px;top:196px;width:800px;height:640px}
.frame{position:absolute;left:30px;top:40px;width:640px;height:540px;background:var(--paper);border-radius:26px;transform:rotate(-3deg);box-shadow:0 30px 70px rgba(0,0,0,.42);overflow:hidden}
.frame .bar{height:46px;background:#EDF0F1;display:flex;align-items:center;gap:8px;padding:0 18px}
.frame .bar i{width:11px;height:11px;border-radius:50%;background:#C7CFD3}
.frame .bar u{flex:1;height:15px;border-radius:8px;background:#fff;margin-left:10px;text-decoration:none}
.frame .body{background:var(--cream);padding:20px;display:flex;flex-direction:column;gap:16px;height:calc(100% - 46px)}
.card{background:#fff;border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:16px;box-shadow:0 3px 10px rgba(10,66,73,.08);flex:1}
.card .ic{width:52px;height:52px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center}
.card .tx{flex:1}.card .tx b{display:block;font-size:31px;color:var(--ink);letter-spacing:1px}
.card .tx s{display:block;text-decoration:none;font-size:18px;color:#5B6B76;margin-top:5px}
.card .go{background:var(--warm);color:#fff;font-size:20px;padding:12px 20px;border-radius:999px;flex:none;letter-spacing:1px}
.pop{position:absolute;right:-64px;top:-16px;width:360px;background:#fff;border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:14px;transform:rotate(5deg);box-shadow:0 26px 60px rgba(0,0,0,.5)}
.pop .ic{width:46px;height:46px;border-radius:12px;background:rgba(232,106,51,.14);display:flex;align-items:center;justify-content:center;flex:none}
.pop b{display:block;font-size:26px;color:var(--ink)}
.pop s{display:block;text-decoration:none;font-size:15px;color:#5B6B76;margin-top:4px}
.pop .go{margin-left:auto;background:var(--warm);color:#fff;font-size:16px;padding:9px 14px;border-radius:999px}
.seal{position:absolute;right:120px;bottom:150px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
.foot{position:absolute;left:110px;right:110px;top:930px;display:flex;align-items:center;gap:20px;border-top:1.5px solid rgba(255,248,236,.18);padding-top:30px}
.foot b{font-size:32px;color:var(--cream);letter-spacing:2px}
.foot i{font-family:Verdana,sans-serif;font-style:normal;font-size:18px;color:rgba(255,248,236,.6);letter-spacing:2px}
.foot s{text-decoration:none;margin-left:auto;font-size:18px;color:rgba(255,248,236,.6);letter-spacing:1px}
