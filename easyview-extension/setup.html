<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyView · 开始使用</title>
  <link rel="stylesheet" href="setup.css">
  <script src="setup.js" defer></script>
</head>
<body>
  <main class="panel">
    <div class="brand"><img src="assets/easyview-icon-128.png" alt=""><span>EasyView 简界</span></div>
    <h1>开始使用敬老版</h1>
    <p class="intro">打开常用网站，点网页边上的「敬老版」，就能看到大字事项卡。需要听说明时，点卡片旁边的小喇叭。</p>
    <div class="service"><strong>当前服务</strong><span>ev.jvda.online</span></div>
    <form id="setup-form">
      <label for="access-code">评委体验码</label>
      <p class="hint">由 EasyView 团队提供。它只是体验服务的访问码，不是网站密码，也不是模型 API 密钥。</p>
      <input id="access-code" type="password" autocomplete="off" spellcheck="false" placeholder="在这里粘贴体验码">
      <button type="submit" id="save-button">保存并检查连接</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="privacy">使用模型版时，扩展会发送当前网页中提取并压缩的文字说明到 EasyView 服务；不会发送已填写的密码、验证码或表单内容。您也可以不填体验码，在服务错误页选择本地规则版。</p>
    <p class="back">设置完成后，打开普通网页，点击页面上的「敬老版」。需要修改体验码时，可在扩展管理页打开此设置页。</p>
  </main>
</body>
</html>
